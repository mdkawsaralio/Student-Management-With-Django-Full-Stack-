

{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load static %}


{% block link %}
<link href="{% static 'login.css'%}" rel="stylesheet">
{% endblock  %}

{% block content %}

<div class="login">
    <h3>Login</h3>
    <div class="login-form">
 <form method="POST" action="{% url 'login'%}">

                        {% csrf_token %}

                        {{ form|crispy }}

                        <button type="submit">
                            Login
                        </button>

                    </form>


    </div>


</div>


{% endblock  %}
