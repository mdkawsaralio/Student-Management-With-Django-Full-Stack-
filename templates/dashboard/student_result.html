{% extends "base.html" %}


{%load static%}

{% block link %}
<link href="{% static 'teacher_details.css'%}" rel="stylesheet" >

{% endblock link %}

{% block content %}

<div class="teacher-list">
                <h3>Student Result</h3>
                <div class="list">
                    <span>{{student.name}}</span>
                    <span>{{result.name}}</span>
                    <table>
<tr>
                            <th>Subject</th>
                            <th>Mark</th>
                            <th>GPA</th>
                        </tr>

                        {%for i in result%}
                        <tr>
                            <td>{{i.subject.name}}</td>
                            <td>{{i.marks}}</td>
                            <td>{{i.GPA}}</td>
                        </tr>
                       {% endfor %}
                            <tr>
                            <td colspan="2" style="text-align: right;">CGPA</td>
                            <td>{{cgpa}}</td>
                        </tr>
                    </table>
                    
                </div>
                </div>
                


{% endblock  %}
